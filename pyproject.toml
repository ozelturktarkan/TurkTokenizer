[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "turktokenizer-native"
version = "0.1.0rc1"
description = "Standard-library wrapper for the frozen TurkTokenizer Rust research runtime"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Tarkan Özel", email = "turktokenizer@cizgiturk.com"}]
dependencies = []
[project.scripts]
turktokenizer-native = "turktokenizer_native.__main__:main"
[tool.setuptools.packages.find]
where = ["src"]
